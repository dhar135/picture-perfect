<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#657FFA" opacity="0.1"/>
  
  <!-- First P -->
  <path d="M 70 50 
           L 70 150
           M 70 50
           C 70 50, 120 50, 120 85
           C 120 120, 70 120, 70 85"
        stroke="#657FFA"
        stroke-width="12"
        fill="none"
        stroke-linecap="round"/>
  
  <!-- Second P - Offset and Stylized -->
  <path d="M 100 70
           L 100 170
           M 100 70
           C 100 70, 150 70, 150 105
           C 150 140, 100 140, 100 105"
        stroke="#4361EE"
        stroke-width="12"
        fill="none"
        stroke-linecap="round"
        opacity="0.7"/>
</svg>
